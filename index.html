<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="auth-view" class="card" hidden>
      <div class="logo">&#10003;</div>
      <h1 id="auth-title">Welcome back</h1>
      <p class="subtitle" id="auth-subtitle">Sign in to continue to your tasks</p>

      <form id="auth-form">
        <input
          type="text"
          id="auth-username"
          placeholder="Username"
          aria-label="Username"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="auth-password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          minlength="4"
          required
        />
        <button type="submit" id="auth-submit">Sign in</button>
      </form>
      <p id="auth-error" hidden></p>
      <p class="auth-switch">
        <span id="auth-switch-text">No account?</span>
        <button type="button" id="auth-toggle">Sign up</button>
      </p>
    </section>

    <section id="todo-view" class="card" hidden>
      <header class="user-bar">
        <div class="user-info">
          <span class="avatar" id="user-avatar"></span>
          <span id="user-name"></span>
        </div>
        <button type="button" id="sign-out">Sign out</button>
      </header>

      <h1>My Tasks</h1>
      <p class="subtitle" id="task-count"></p>

      <form id="todo-form" autocomplete="off">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a task..."
          aria-label="New task"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list"></ul>

      <div id="empty-state" hidden>
        <div class="empty-icon">&#10003;</div>
        <p>All clear! Add your first task above.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
